# /etc/nginx/sites-available/mcp.conf
#
# Instalacao:
#   sudo cp nginx/mcp.conf /etc/nginx/sites-available/mcp.conf
#   sudo ln -s /etc/nginx/sites-available/mcp.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU_DOMINIO
#

server {
    listen 80;
    server_name SEU_DOMINIO;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    # Certbot preenche automaticamente:
    # ssl_certificate /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Limite de tamanho de request body
    client_max_body_size 1m;

    # Security headers globais
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # =========================================================================
    # MODO 1: Dominio dedicado (padrao)
    # Acesso: https://SEU_DOMINIO/
    # =========================================================================

    # MCP Server (Streamable HTTP) — requer Authorization header
    location /mcp {
        if ($http_authorization = "") {
            return 401 '{"detail":"Authorization header required"}';
        }

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # OpenTelemetry Collector (browser traces do frontend)
    location /otel/ {
        proxy_pass http://127.0.0.1:4318/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # Frontend (React SPA)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # =========================================================================
    # MODO 2: Subpath em dominio compartilhado (comentado)
    #
    # Use quando varios MCPs dividem o mesmo dominio.
    # Acesso: https://mcp.dominio.com/otrs/
    #
    # Para ativar:
    #   1. Comente todo o MODO 1 acima
    #   2. Descomente o MODO 2 abaixo
    #   3. No .env do projeto, defina: VITE_BASE_PATH=/otrs/
    #   4. Rebuild o frontend: docker compose build frontend
    #   5. sudo nginx -t && sudo systemctl reload nginx
    # =========================================================================

    ## MCP Server (Streamable HTTP)
    # location /otrs/mcp {
