server {

    listen 80;
    server_name mcp-zabbix.beonup.com.br;

    access_log /var/log/nginx/mcp-admin-access.log;
    error_log  /var/log/nginx/mcp-admin-error.log;

    # Limite de tamanho de request body
    client_max_body_size 1m;

    # Security Headers
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(self); microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Remove X-Powered-By
    proxy_hide_header X-Powered-By;
    fastcgi_hide_header X-Powered-By;

    # -----------------------------------------------------------------
    # MCP Server (Streamable HTTP)
    # IMPORTANTE: sem trailing slash — FastMCP espera /mcp exato
    # O = (exact match) evita conflito com /otrs/mcp-tokens e outras rotas
    # -----------------------------------------------------------------
    location = /otrs/mcp {
        proxy_pass http://127.0.0.1:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # -----------------------------------------------------------------
    # API REST
    # -----------------------------------------------------------------
    location = /otrs/api {
        return 308 /otrs/api/;
    }

    location ^~ /otrs/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # -----------------------------------------------------------------
    # OpenTelemetry Collector
    # -----------------------------------------------------------------
    location = /otrs/otel {
        return 308 /otrs/otel/;
    }

    location ^~ /otrs/otel/ {
        proxy_pass http://127.0.0.1:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # -----------------------------------------------------------------
    # Frontend OTRS MCP (React SPA)
    # -----------------------------------------------------------------
    location = /otrs {
        return 301 /otrs/;
    }

    location ^~ /otrs/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # -----------------------------------------------------------------
    # Raiz — outro servico (porta 9090)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
