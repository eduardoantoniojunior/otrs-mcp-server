services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8443:8443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
      - mcp-server
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      - OTRS_ACTIVITY_FILE=/data/activity.json
      - OTRS_DB_PATH=/data/otrs-mcp.db
      - OTRS_MCP_TRANSPORT=http
      - OTRS_MCP_HOST=mcp-server
      - OTRS_MCP_PORT=8001
    volumes:
      - app_data:/data
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3000/api/health').raise_for_status()" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - edge

  mcp-server:
    build: .
    env_file: .env
    environment:
      - OTRS_ACTIVITY_FILE=/data/activity.json
      - OTRS_DB_PATH=/data/otrs-mcp.db
      - OTRS_MCP_TRANSPORT=http
      - OTRS_MCP_HOST=0.0.0.0
      - OTRS_MCP_PORT=8001
    volumes:
      - app_data:/data
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8001)); s.close()\"" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - edge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - edge

volumes:
  app_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
