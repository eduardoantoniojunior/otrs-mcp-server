services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp-server:
    build: .
    env_file: .env
    restart: unless-stopped
    stdin_open: true
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; print('healthy')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
