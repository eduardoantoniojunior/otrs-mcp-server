# /etc/fail2ban/filter.d/nginx-botsearch.conf
#
# Detecta scanners e bots que procuram paths comuns de vulnerabilidades
# (wp-admin, .env, phpmyadmin, etc)

[Definition]
failregex = ^<HOST> .* "(?:GET|POST) /(?:wp-admin|wp-login|\.env|phpmy|admin\.php|cgi-bin|\.git|\.aws|actuator|boaform).* HTTP/.*" (?:400|403|404)
ignoreregex =
